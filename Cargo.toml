[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0-beta.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
aperture-compositor = { path = "crates/compositor" }
aperture-gateway = { path = "crates/gateway" }
aperture-runner = { path = "crates/runner" }
aperture-store = { path = "crates/store" }
aperture-tunnel = { path = "crates/tunnel" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "signal", "fs"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7"] }

# Frames are compared and copied pixel by pixel many times a second, which unoptimized
# takes longer than the frames are apart.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
