name: code quality

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  typescript:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: format
            run: pnpm format:check
          - name: lint
            run: pnpm lint
          - name: typecheck
            run: |
              pnpm --filter @aperture-browser/web generate-routes
              git diff --exit-code -- apps/web/src/routeTree.gen.ts
              pnpm typecheck
          - name: build
            run: pnpm build
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: pnpm/action-setup@v6.0.9
        with:
          # Keep in step with engines.pnpm in package.json and pnpmLatest in flake.nix.
          version: 11.27.1

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v6.0.9
        with:
          # Keep in step with engines.pnpm in package.json and pnpmLatest in flake.nix.
          version: 11.27.1

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libei-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            pkg-config

      # The Go server embeds the built web app, so it must exist before Go is linted.
      - name: Build the web app
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @aperture-browser/web build

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m
          problem-matchers: true

      - name: Verify generated OpenAPI code
        run: |
          ./scripts/generate-openapi.sh
          git diff --exit-code -- api internal/httpapi/openapi packages/api-schema
