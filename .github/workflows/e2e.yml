name: e2e

# Real sessions end to end, which takes a browser and a while. checks.yml runs this after it
# has built the programs, for what asks for it; release-please.yml runs it before it
# publishes. By itself it runs for a pull request that is given the `e2e` label after its
# checks began, and by hand.
on:
  pull_request:
    types:
      - labeled
  workflow_dispatch:
  workflow_call:
    inputs:
      built:
        description: Whether the caller built the programs just before, so the cache has them
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Called by another workflow, this one has the caller's name, and a group of its own. What
# is pushed to master runs to its end: a release waits on it.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # The programs, once for the jobs after this one: from the cache where whoever ran this
  # built them before, and built here and put there where nobody did.
  programs:
    name: programs
    # A label that is another's asks for nothing, and what the caller built is not built again.
    if: >-
      !inputs.built &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: aperture-browser
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}
          pushFilter: (-source$|-vendor|user-environment)

      - name: Build
        run: nix build .#aperture .#aperture-control --no-link --print-build-logs

  e2e:
    name: e2e ${{ matrix.name }}
    needs: programs
    # After the programs, built here or by the caller: a job that is passed over fails nothing.
    if: >-
      !cancelled() &&
      needs.programs.result != 'failure' &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sessions
            run: pnpm test:e2e
          - name: control plane
            run: pnpm --filter @aperture-browser/control test
          - name: migrator
            run: pnpm --filter @aperture-browser/migrate test
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: aperture-browser
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}
          pushFilter: (-source$|-vendor|user-environment)

      - name: Let the sandbox make its namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The programs as a release has them, which checks.yml has built and the cache has
      # for whatever commit changed none of them.
      - name: Build the programs
        run: |
          nix build .#aperture-unwrapped --out-link programs --print-build-logs
          # Where they are, as a program finds itself: a check of what a browser sees of
          # the machine goes by it.
          echo "APERTURE_BIN=$(readlink --canonicalize programs)/bin" >> "$GITHUB_ENV"

      - name: Build the workbench, the console and the companion
        run: |
          nix develop --command pnpm install --frozen-lockfile
          nix develop --command pnpm --filter @aperture-browser/workbench build
          nix develop --command pnpm --filter @aperture-browser/console build
          nix develop --command pnpm --filter @aperture-browser/companion build

      - name: Check
        env:
          RUN: ${{ matrix.run }}
          # Where the checks keep the pictures they take of what a page shows.
          APERTURE_E2E_LOGS: ${{ runner.temp }}/e2e
        run: |
          mkdir -p "$APERTURE_E2E_LOGS"
          nix develop --command $RUN

      # What the pages looked like, for whoever reviews by looking.
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: pictures-${{ matrix.name }}
          path: ${{ runner.temp }}/e2e/*.png
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: test-failures-${{ matrix.name }}
          path: test-failures/
          if-no-files-found: ignore
          retention-days: 14

  # One machine set up by the NixOS modules alone, which is how a node is installed.
  deployment:
    name: deployment
    needs: programs
    # After the programs, built here or by the caller: a job that is passed over fails nothing.
    if: >-
      !cancelled() &&
      needs.programs.result != 'failure' &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: aperture-browser
          skipPush: true

      - name: The modules, on a machine of their own
        run: nix build .#checks.x86_64-linux.deployment --no-link --print-build-logs
