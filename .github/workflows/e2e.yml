name: e2e

# Real sessions end to end, which takes a browser and a while: for what is pushed to the
# branches releases are made of, for a pull request that asks for it with the `e2e` label,
# for the pull request of a release, by hand, and for release-please.yml before it publishes.
on:
  pull_request:
    types:
      - opened
      - labeled
      - synchronize
  push:
    branches:
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Called by another workflow, this one has the caller's name, and a group of its own. What
# is pushed to master runs to its end: a release waits on it.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # The programs, built once for the jobs after this one, which take them from the cache.
  # checks.yml builds the same for the same commit: while it is at it, this waits for the
  # cache to have them and builds nothing; where it is not, this builds them.
  programs:
    name: programs
    # The commit a release is made of is pushed as well, and release-please.yml asks for
    # these checks of it: the push asks for nothing then.
    if: &asked >-
      (
        github.event_name == 'pull_request' &&
        (
          contains(github.event.pull_request.labels.*.name, 'e2e') ||
          startsWith(github.head_ref, 'release-please--')
        )
      ) ||
      (
        github.event_name != 'pull_request' &&
        !(
          github.workflow == 'e2e' &&
          github.event_name == 'push' &&
          startsWith(github.event.head_commit.message, 'chore(master): release')
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: aperture-browser
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}
          pushFilter: (-source$|-vendor|user-environment)

      - name: Wait for the cache while checks.yml builds
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cached() {
            local path
            for path in "$@"; do
              curl -fsS -m 10 -o /dev/null "https://aperture-browser.cachix.org/$(basename "$path" | cut -d- -f1).narinfo" || return 1
            done
          }
          building() {
            gh api "repos/$REPOSITORY/actions/runs?head_sha=$COMMIT&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "checks" and .status != "completed")] | length > 0'
          }
          paths=(
            "$(nix eval --raw .#aperture-unwrapped.outPath)"
            "$(nix eval --raw .#aperture-control.outPath)"
          )
          # A run that was asked for a moment ago is not listed yet.
          sleep 30
          for ((waited = 0; waited < 1800; waited += 20)); do
            if cached "${paths[@]}"; then
              echo "the cache has them"
              exit 0
            fi
            if [[ "$(building)" != true ]]; then
              echo "checks.yml is not building them"
              exit 0
            fi
            sleep 20
          done

      - name: Build what the cache has not
        run: nix build .#aperture .#aperture-control --no-link --print-build-logs

  e2e:
    name: e2e ${{ matrix.name }}
    needs: programs
    if: *asked
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sessions
            run: pnpm test:e2e
          - name: control plane
            run: pnpm --filter @aperture-browser/control test
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: aperture-browser
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}
          pushFilter: (-source$|-vendor|user-environment)

      - name: Let the sandbox make its namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The programs as a release has them, which checks.yml has built and the cache has
      # for whatever commit changed none of them.
      - name: Build the programs
        run: |
          nix build .#aperture-unwrapped --out-link programs --print-build-logs
          # Where they are, as a program finds itself: a check of what a browser sees of
          # the machine goes by it.
          echo "APERTURE_BIN=$(readlink --canonicalize programs)/bin" >> "$GITHUB_ENV"

      - name: Build the workbench and the console
        run: |
          nix develop --command pnpm install --frozen-lockfile
          nix develop --command pnpm --filter @aperture-browser/workbench build
          nix develop --command pnpm --filter @aperture-browser/console build

      - name: Check
        env:
          RUN: ${{ matrix.run }}
        run: nix develop --command $RUN

      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: test-failures-${{ matrix.name }}
          path: test-failures/
          if-no-files-found: ignore
          retention-days: 14

  # One machine set up by the NixOS modules alone, which is how a node is installed.
  deployment:
    name: deployment
    needs: programs
    if: *asked
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: aperture-browser
          skipPush: true

      - name: The modules, on a machine of their own
        run: nix build .#checks.x86_64-linux.deployment --no-link --print-build-logs
