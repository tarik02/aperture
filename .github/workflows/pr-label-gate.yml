name: pr label gate

on:
  workflow_call:

permissions:
  issues: write
  pull-requests: write

jobs:
  gate:
    name: check ${{ github.event.label.name }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const { label, pull_request: pullRequest, sender } = context.payload

            try {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: pullRequest.number,
                name: label.name,
              })
            } catch (error) {
              if (error.status !== 404) throw error
            }

            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username: sender.login,
            })
            if (!['admin', 'write'].includes(data.permission)) {
              core.setFailed(`${sender.login} has ${data.permission} access; ${label.name} needs write`)
            }
