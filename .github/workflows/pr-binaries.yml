name: pr binaries

on:
  pull_request_target:
    types:
      - labeled

permissions:
  contents: read

concurrency:
  group: pr-binaries-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event.label.name == 'build-binaries'
    permissions:
      issues: write
      pull-requests: write
    uses: ./.github/workflows/pr-label-gate.yml

  build:
    name: build binaries
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.27.1

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ${{ steps.pnpm-store.outputs.path }}
          key: build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'pnpm-lock.yaml') }}
          restore-keys: build-${{ runner.os }}-${{ runner.arch }}-

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libei-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            pkg-config

      - name: Build snapshot artifacts
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binaries
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aperture-pr-binaries
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14
