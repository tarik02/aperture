name: docs

on:
  push:
    branches:
      - master
    paths: &paths
      - apps/docs/**
      - packages/**
      - api/openapi.yaml
      - pnpm-lock.yaml
      - .github/workflows/docs.yml
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-gh-pages
  cancel-in-progress: false

jobs:
  build:
    name: build docs
    if: >-
      github.event.action != 'closed' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.27.1

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build
        env:
          DOCS_BASE_PATH: >-
            ${{ github.event_name == 'pull_request'
            && format('/{0}/pr-preview/pr-{1}/', github.event.repository.name, github.event.pull_request.number)
            || format('/{0}/', github.event.repository.name) }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @aperture-browser/docs build
          touch apps/docs/dist/client/.nojekyll

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: docs-site
          path: apps/docs/dist/client
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: deploy docs
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/download-artifact@v8.0.1
        with:
          name: docs-site
          path: ${{ runner.temp }}/docs-site

      - uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: ${{ runner.temp }}/docs-site
          branch: gh-pages
          clean-exclude: pr-preview/

  preview:
    name: docs preview
    needs: build
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.build.result == 'success' || github.event.action == 'closed')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/download-artifact@v8.0.1
        if: github.event.action != 'closed'
        with:
          name: docs-site
          path: ${{ runner.temp }}/docs-site

      - uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: ${{ runner.temp }}/docs-site
          qr-code: false
