name: docs

on:
  push:
    branches:
      - master
    paths: &paths
      - apps/docs/**
      - packages/**
      - api/openapi.yaml
      - pnpm-lock.yaml
      - .github/workflows/docs.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build docs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.27.1

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @aperture-browser/docs build

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: docs-site
          path: apps/docs/dist/client
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: deploy docs
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: docs-site
          path: ${{ runner.temp }}/docs-site

      - id: deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.140.0
          command: >-
            pages deploy ${{ runner.temp }}/docs-site
            --project-name=aperture-browser-docs
            --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'master' }}
            --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}

      - name: Comment preview link
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: docs-preview
          message: |
            Docs preview for ${{ github.event.pull_request.head.sha }}: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
