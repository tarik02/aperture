name: checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: format
            run: pnpm format:check
          - name: lint
            run: pnpm lint
          - name: typecheck
            run: pnpm typecheck
          - name: build
            run: pnpm build
          - name: companion
            run: pnpm --filter @aperture-browser/companion test
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.27.1

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  rust:
    name: rust
    runs-on: ubuntu-24.04
    env:
      # The programs are not kept: without debug information they build faster and fit the disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: cachix/install-nix-action@v31

      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Format
        run: nix develop --command cargo fmt --check

      - name: Clippy
        run: nix develop --command cargo clippy --workspace --all-targets -- --deny warnings

      - name: Test
        run: nix develop --command cargo test --workspace

  generated:
    name: generated code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: cachix/install-nix-action@v31

      - name: Generate
        run: |
          nix develop --command pnpm install --frozen-lockfile
          nix develop --command pnpm --filter @aperture-browser/session-client generate
          nix develop --command pnpm --filter @aperture-browser/executor-client generate
          nix develop --command pnpm --filter @aperture-browser/control generate

      - name: Verify nothing changed
        run: git diff --exit-code

  # What the flake installs. Whatever is built here goes to the cache, where the jobs after
  # this one, the next run and the machines that install a release take it from: a change
  # that touches no program builds none again.
  nix:
    name: nix packages
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: aperture-browser
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # A pull request from elsewhere has no token, and builds what it needs itself.
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}
          # Sources and what images are assembled from are made again faster than fetched.
          pushFilter: (-source$|-vendor|stream-aperture-|layers\.json|excludePaths|closure-info|user-environment)

      # A hash left as it was when pnpm-lock.yaml changed fails nowhere else: the
      # dependencies of before are taken from the store or a cache by it. Fetching them
      # again is what tells.
      - name: Verify the dependency hash
        run: |
          nix build .#aperture-control.pnpmDeps --no-link --print-build-logs
          nix build --rebuild .#aperture-control.pnpmDeps --no-link --print-build-logs

      - name: Evaluate
        run: nix flake check --no-build --all-systems

      - name: Build
        run: >-
          nix build
          .#aperture
          .#aperture-control
          .#aperture-migrate
          .#aperture-keys
          .#checks.x86_64-linux.aperture-ffmpeg-features
          --no-link --print-build-logs

  # The images are the packages above and little more; they are started here as their
  # users start them, which nothing else does.
  images:
    name: ${{ matrix.name }}
    needs: nix
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: session image
            images: container
            smoke: .github/scripts/smoke-image.sh container.tar.gz
          # A whole deployment: the control plane's image and the node's, with the
          # database and the proxy deploy/compose.yaml puts beside them, under Docker.
          - name: deployment images
            images: control-image node-image
            smoke: .github/scripts/smoke-compose.sh control-image.tar.gz node-image.tar.gz
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: aperture-browser
          skipPush: true

      - name: Build
        env:
          IMAGES: ${{ matrix.images }}
        run: |
          for image in $IMAGES; do
            nix build ".#$image" --print-build-logs
            ./result | gzip --fast > "$image.tar.gz"
          done

      # A session's sandbox is made of user namespaces, which this runner's AppArmor
      # keeps from whoever is not root.
      - name: Let the sandbox make its namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Start
        run: ${{ matrix.smoke }}

  # Real sessions end to end, on the programs built above: for what is pushed to master,
  # for a pull request that has the `e2e` label, for the pull request of a release, and by
  # hand. The commit a release is made of is pushed as well, and release-please.yml asks
  # for these checks of it: the push asks for nothing then.
  e2e:
    name: e2e
    needs: nix
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        (
          contains(github.event.pull_request.labels.*.name, 'e2e') ||
          startsWith(github.head_ref, 'release-please--')
        )
      ) ||
      (
        github.event_name == 'push' &&
        !startsWith(github.event.head_commit.message, 'chore(master): release')
      )
    uses: ./.github/workflows/e2e.yml
    with:
      built: true
    secrets: inherit
