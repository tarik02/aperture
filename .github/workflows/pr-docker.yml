name: pr docker

on:
  pull_request_target:
    types:
      - labeled

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: pr-docker-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event.label.name == 'build-docker'
    permissions:
      issues: write
      pull-requests: write
    uses: ./.github/workflows/pr-label-gate.yml

  build:
    name: build ${{ matrix.variant }} ${{ matrix.arch }} image
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            nix_attribute: aperture-docker
            suffix: ""
            arch: amd64
            runner: ubuntu-24.04
          - variant: default
            nix_attribute: aperture-docker
            suffix: ""
            arch: arm64
            runner: ubuntu-24.04-arm
          - variant: gpu
            nix_attribute: aperture-docker-gpu
            suffix: -gpu
            arch: amd64
            runner: ubuntu-24.04
          - variant: gpu
            nix_attribute: aperture-docker-gpu
            suffix: -gpu
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Created before Nix starts, so the root nix-daemon doesn't create it.
      - run: mkdir -p "$RUNNER_TEMP/nix-deps"

      - uses: cachix/install-nix-action@v31.10.7
        with:
          extra_nix_config: |
            extra-substituters = file://${{ runner.temp }}/nix-deps?trusted=true&priority=10

      # The docker image workflow on master keeps one entry per architecture.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/nix-deps
          key: nix-deps-${{ runner.arch }}
          restore-keys: nix-deps-${{ runner.arch }}-

      - uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        env:
          NIX_ATTRIBUTE: ${{ matrix.nix_attribute }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          short_sha="${SHA::12}"
          printf '0.0.0-pr.%s.%s' "$PR_NUMBER" "$short_sha" > .aperture-deploy-version
          printf '%s' "$SHA" > .aperture-source-revision
          nix build "path:.#$NIX_ATTRIBUTE" --print-build-logs
          cp --dereference result "aperture-pr-${PR_NUMBER}-${{ matrix.variant }}-${{ matrix.arch }}.tar.gz"

      - name: Push architecture image
        id: push
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE: ghcr.io/${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          short_sha="${SHA::12}"
          version="0.0.0-pr.${PR_NUMBER}.${short_sha}${SUFFIX}"
          tag="pr-${PR_NUMBER}-${short_sha}${SUFFIX}"
          docker load < result
          docker tag "aperture:$version" "$IMAGE:$tag-$ARCH"
          docker push "$IMAGE:$tag-$ARCH"
          repo_digest="$(docker image inspect "$IMAGE:$tag-$ARCH" --format '{{json .RepoDigests}}' | jq -r --arg image "$IMAGE" '.[] | select(startswith($image + "@"))' | head -n 1)"
          echo "digest=${repo_digest#*@}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          artifact-name: aperture-pr-${{ github.event.pull_request.number }}-${{ matrix.variant }}-${{ matrix.arch }}-sbom
          output-file: aperture-pr-${{ github.event.pull_request.number }}-${{ matrix.variant }}-${{ matrix.arch }}.spdx.json
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest@v4.2.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: aperture-pr-${{ github.event.pull_request.number }}-${{ matrix.variant }}-${{ matrix.arch }}.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest build provenance
        uses: actions/attest@v4.2.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign architecture image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Upload image
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aperture-pr-docker-${{ matrix.variant }}-${{ matrix.arch }}
          path: aperture-pr-${{ github.event.pull_request.number }}-${{ matrix.variant }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: publish ${{ matrix.variant }} image
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            suffix: ""
            multiarch: true
          - variant: gpu
            suffix: -gpu
            multiarch: true
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image manifest
        id: publish
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          MULTIARCH: ${{ matrix.multiarch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          short_sha="${SHA::12}"
          tag="pr-${PR_NUMBER}-${short_sha}${SUFFIX}"
          source_args=("$IMAGE:$tag-amd64")
          if [[ "$MULTIARCH" == "true" ]]; then
            source_args+=("$IMAGE:$tag-arm64")
          fi
          docker buildx imagetools create \
            --tag "$IMAGE:$tag" \
            --tag "$IMAGE:pr-$PR_NUMBER$SUFFIX" \
            "${source_args[@]}"
          docker buildx imagetools inspect "$IMAGE:$tag"
          digest="$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest multi-architecture provenance
        uses: actions/attest@v4.2.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign multi-architecture image
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  comment:
    name: comment image links
    needs:
      - build
      - publish
    runs-on: ubuntu-24.04
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Prepare build links
        id: comment
        uses: actions/github-script@v9.0.0
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo
            const pullNumber = context.payload.pull_request.number
            const shortSha = context.payload.pull_request.head.sha.slice(0, 12)
            const image = `ghcr.io/${owner}/${repo}`
            const tag = `pr-${pullNumber}-${shortSha}`
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: context.runId, per_page: 100 },
            )
            const artifactLines = artifacts
              .filter((artifact) => artifact.name.startsWith('aperture-pr-docker-'))
              .sort((left, right) => left.name.localeCompare(right.name))
              .map((artifact) => {
                const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`
                return `- [${artifact.name}](${url})`
              })

            return [
              `Docker images for ${context.payload.pull_request.head.sha}:`,
              '',
              ...artifactLines,
              `- \`${image}:${tag}\``,
              `- \`${image}:pr-${pullNumber}\``,
              `- \`${image}:${tag}-gpu\``,
              `- \`${image}:pr-${pullNumber}-gpu\``,
            ].join('\n')

      - name: Comment build links
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          header: aperture-pr-docker
          message: ${{ steps.comment.outputs.result }}
          skip_unchanged: true
