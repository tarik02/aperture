name: docker image

on:
  workflow_call:
    inputs:
      version:
        description: Version embedded into the image
        required: true
        type: string
      ref:
        description: Git ref to build
        required: true
        type: string
      tags:
        description: Newline-separated GHCR tags
        required: true
        type: string

permissions:
  actions: write
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    name: build ${{ matrix.variant }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            nix_attribute: aperture-docker
            suffix: ""
            arch: amd64
            runner: ubuntu-24.04
          - variant: default
            nix_attribute: aperture-docker
            suffix: ""
            arch: arm64
            runner: ubuntu-24.04-arm
          - variant: gpu
            nix_attribute: aperture-docker-gpu
            suffix: -gpu
            arch: amd64
            runner: ubuntu-24.04
          - variant: gpu
            nix_attribute: aperture-docker-gpu
            suffix: -gpu
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.ref }}

      # Created before Nix starts, so the root nix-daemon doesn't create it.
      - run: mkdir -p "$RUNNER_TEMP/nix-deps"

      - uses: cachix/install-nix-action@v31.10.7
        with:
          extra_nix_config: |
            extra-substituters = file://${{ runner.temp }}/nix-deps?trusted=true&priority=10

      # The key changes only when a custom build does, e.g. on a nixpkgs update.
      - name: Resolve Nix dependency cache key
        id: nix-deps
        run: |
          drv="$(nix eval --raw "path:.#docker-build-deps.drvPath")"
          hash="$(basename "$drv")"
          echo "key=nix-deps-$RUNNER_ARCH-${hash%%-*}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6.1.0
        id: nix-deps-restore
        with:
          path: ${{ runner.temp }}/nix-deps
          key: ${{ steps.nix-deps.outputs.key }}
          restore-keys: nix-deps-${{ runner.arch }}-

      - uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        env:
          NIX_ATTRIBUTE: ${{ matrix.nix_attribute }}
          VERSION: ${{ inputs.version }}
        run: |
          printf '%s' "$VERSION" > .aperture-deploy-version
          printf '%s' "$(git rev-parse HEAD)" > .aperture-source-revision
          nix build "path:.#$NIX_ATTRIBUTE" --print-build-logs

      # Only master writes the cache, and only what cache.nixos.org lacks: the image
      # itself changes with every commit and would crowd everything else out.
      - name: Collect Nix dependency cache
        id: nix-deps-collect
        if: github.ref == 'refs/heads/master' && steps.nix-deps-restore.outputs.cache-hit != 'true'
        run: |
          deps="$(nix build "path:.#docker-build-deps" --no-link --print-out-paths --print-build-logs)"
          cache="$RUNNER_TEMP/nix-deps"
          # The nix-daemon runs as root and may have created store metadata in there.
          sudo rm -rf "$cache"
          # A binary cache only accepts a path together with its references, so this
          # copies the whole closure and then drops what cache.nixos.org serves anyway.
          nix copy --to "file://$cache?compression=none" "$deps"
          nix path-info --recursive "$deps" |
            while IFS= read -r path; do
              name="${path#/nix/store/}"
              hash="${name%%-*}"
              if curl --silent --fail --head --output /dev/null "https://cache.nixos.org/$hash.narinfo"; then
                rm "$cache/$(sed -n 's/^URL: //p' "$cache/$hash.narinfo")" "$cache/$hash.narinfo"
              fi
            done
          du -sh "$cache"

      - uses: actions/cache/save@v6.1.0
        if: steps.nix-deps-collect.outcome == 'success'
        with:
          path: ${{ runner.temp }}/nix-deps
          key: ${{ steps.nix-deps.outputs.key }}

      - name: Delete older Nix dependency caches
        if: steps.nix-deps-collect.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.nix-deps.outputs.key }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key "nix-deps-$RUNNER_ARCH-" --json key --jq '.[].key' |
            while IFS= read -r key; do
              if [ "$key" != "$KEY" ]; then
                gh cache delete --repo "$GITHUB_REPOSITORY" "$key"
              fi
            done

      - name: Push architecture image
        id: push
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE: ghcr.io/${{ github.repository }}
          SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ inputs.version }}
        run: |
          docker load < result
          docker tag "aperture:$VERSION$SUFFIX" "$IMAGE:$VERSION$SUFFIX-$ARCH"
          docker push "$IMAGE:$VERSION$SUFFIX-$ARCH"
          repo_digest="$(docker image inspect "$IMAGE:$VERSION$SUFFIX-$ARCH" --format '{{json .RepoDigests}}' | jq -r --arg image "$IMAGE" '.[] | select(startswith($image + "@"))' | head -n 1)"
          echo "digest=${repo_digest#*@}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          artifact-name: aperture-${{ inputs.version }}-${{ matrix.variant }}-${{ matrix.arch }}-sbom
          output-file: aperture-${{ inputs.version }}-${{ matrix.variant }}-${{ matrix.arch }}.spdx.json
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest@v4.2.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: aperture-${{ inputs.version }}-${{ matrix.variant }}-${{ matrix.arch }}.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest build provenance
        uses: actions/attest@v4.2.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign architecture image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  manifest:
    name: publish ${{ matrix.variant }} manifest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            suffix: ""
            multiarch: true
          - variant: gpu
            suffix: -gpu
            multiarch: true
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image manifest
        id: publish
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          MULTIARCH: ${{ matrix.multiarch }}
          SUFFIX: ${{ matrix.suffix }}
          TAGS: ${{ inputs.tags }}
          VERSION: ${{ inputs.version }}
        run: |
          tag_args=()
          first_tag=""
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              if [[ -z "$first_tag" ]]; then
                first_tag="$tag$SUFFIX"
              fi
              tag_args+=(--tag "$IMAGE:$tag$SUFFIX")
            fi
          done <<< "$TAGS"

          source_args=("$IMAGE:$VERSION$SUFFIX-amd64")
          if [[ "$MULTIARCH" == "true" ]]; then
            source_args+=("$IMAGE:$VERSION$SUFFIX-arm64")
          fi

          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${source_args[@]}"

          docker buildx imagetools inspect "$IMAGE:$first_tag"
          digest="$(docker buildx imagetools inspect "$IMAGE:$first_tag" --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest multi-architecture provenance
        uses: actions/attest@v4.2.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign multi-architecture image
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
