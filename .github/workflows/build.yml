name: build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: nix flake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      # Created before Nix starts, so the root nix-daemon doesn't create it.
      - run: mkdir -p "$RUNNER_TEMP/nix-deps"

      - uses: cachix/install-nix-action@v31.10.7
        with:
          extra_nix_config: |
            extra-substituters = file://${{ runner.temp }}/nix-deps?trusted=true&priority=10

      # The docker image workflow on master keeps one entry per architecture.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/nix-deps
          key: nix-deps-${{ runner.arch }}
          restore-keys: nix-deps-${{ runner.arch }}-

      - name: Verify frontend dependency hash
        run: |
          nix build .#aperture.pnpmDeps --no-link --print-build-logs
          nix build --rebuild .#aperture.pnpmDeps --no-link --print-build-logs

      - name: Build and check
        run: nix flake check --print-build-logs
