name: build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: nix flake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - uses: cachix/install-nix-action@v31.10.7

      - uses: cachix/cachix-action@v17
        with:
          name: aperture-browser
          skipPush: true

      - name: Verify frontend dependency hash
        run: |
          nix build .#aperture.pnpmDeps --no-link --print-build-logs
          nix build --rebuild .#aperture.pnpmDeps --no-link --print-build-logs

      - name: Build and check
        run: nix flake check --print-build-logs
