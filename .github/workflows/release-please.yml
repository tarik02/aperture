name: release please

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release PR / stable release
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  stable:
    name: stable artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v6.0.9
        with:
          # Keep in step with engines.pnpm in package.json and pnpmLatest in flake.nix.
          version: 11.27.1

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libei-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            pkg-config

      - name: Upload release artifacts
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    name: npm packages
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # npm trusted publishing (OIDC) and provenance.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@v6.0.9
        with:
          # Keep in step with engines.pnpm in package.json and pnpmLatest in flake.nix.
          version: 11.27.1

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Build packages
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "./packages/**" build

      # pnpm publishes the public packages in dependency order and skips versions
      # already on the registry. It authenticates with trusted publishing (OIDC) and adds
      # provenance; the tag checkout is detached, hence --no-git-checks.
      - name: Publish packages
        run: pnpm publish --recursive --filter "./packages/**" --access public --no-git-checks
        env:
          # Only used for a package's first publish, before its trusted publisher is set
          # up on npmjs.com; pnpm falls back to it when the OIDC exchange is refused.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  extensions:
    name: extension zips
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@v6.0.9
        with:
          # Keep in step with engines.pnpm in package.json and pnpmLatest in flake.nix.
          version: 11.27.1

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build and upload extension zips
        run: |
          pnpm install --frozen-lockfile
          zips="$(node scripts/release-extensions.mjs "$VERSION" "$RUNNER_TEMP/extensions")"
          if [ -n "$zips" ]; then
            # shellcheck disable=SC2086
            gh release upload "$TAG" $zips --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}

  docker:
    name: stable docker image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker-image.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      ref: ${{ needs.release-please.outputs.tag_name }}
      tags: |
        ${{ needs.release-please.outputs.version }}
        latest
