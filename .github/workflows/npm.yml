name: npm

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    name: pack packages
    # Nightlies are the only prereleases published to npm; any other would need its
    # own dist-tag.
    if: >-
      !github.event.release.prerelease ||
      startsWith(github.event.release.tag_name, 'v0.0.0-nightly.')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.27.1

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter "./packages/**" build

      # Nothing bumps package.json for nightlies. Internal deps use workspace:*, so
      # pack pins them to this version too.
      - name: Set nightly version
        if: github.event.release.prerelease
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: pnpm --recursive --filter "./packages/**" exec npm pkg set version="${RELEASE_TAG#v}"

      - name: Pack packages
        run: pnpm --filter "./packages/**" pack --recursive --pack-destination "$RUNNER_TEMP/packages"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: npm-packages
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish packages
    needs: pack
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.27.1

      # No registry-url: it writes an empty auth token to .npmrc, which can stop the
      # OIDC token exchange that trusted publishing relies on.
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24

      - uses: actions/download-artifact@v8.0.1
        with:
          name: npm-packages
          path: ${{ runner.temp }}/packages

      - name: Publish packages
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          tag="latest"
          if [ "$PRERELEASE" = "true" ]; then
            tag="nightly"
          fi
          for manifest in packages/*/package.json; do
            jq -e '.private != true' "$manifest" > /dev/null || continue
            name="$(jq -r .name "$manifest")"
            tarball="$RUNNER_TEMP/packages/$(tr / - <<< "${name#@}")-$version.tgz"
            packed="$(tar -xOzf "$tarball" package/package.json | jq -r '.name + "@" + .version')"
            if [ "$packed" != "$name@$version" ]; then
              echo "::error::$tarball holds $packed, expected $name@$version"
              exit 1
            fi
            if pnpm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            pnpm publish "$tarball" --access public --tag "$tag" --no-git-checks
          done
          echo "Published \`$version\` under the \`$tag\` dist-tag." >> "$GITHUB_STEP_SUMMARY"
