name: npm
run-name: "${{ github.event_name == 'release' && format('npm {0}', github.event.release.tag_name) || format('npm snapshot for #{0}', inputs.pr) }}"

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number
      sha:
        description: Pull request commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-${{ inputs.pr || github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    name: pack packages
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.sha || github.event.release.tag_name }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.27.1

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - name: Set snapshot version
        if: github.event_name == 'workflow_dispatch'
        env:
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
        run: node scripts/set-snapshot-version.ts "0.0.0-pr.${PR}.${SHA::12}"

      - name: Pack packages
        run: |
          pnpm --filter "./packages/**" build
          pnpm --filter "./packages/**" pack --recursive --pack-destination "$RUNNER_TEMP/packages"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: npm-packages
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish packages
    needs: pack
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.27.1

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8.0.1
        with:
          name: npm-packages
          path: ${{ runner.temp }}/packages

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PR: ${{ inputs.pr }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SHA: ${{ inputs.sha }}
        run: |
          if [ -n "$PR" ]; then
            version="0.0.0-pr.${PR}.${SHA::12}"
            tag="pr-${PR}"
          else
            version="${RELEASE_TAG#v}"
            tag="latest"
          fi
          for manifest in packages/*/package.json; do
            jq -e '.private != true' "$manifest" > /dev/null || continue
            name="$(jq -r .name "$manifest")"
            tarball="$RUNNER_TEMP/packages/$(tr / - <<< "${name#@}")-$version.tgz"
            packed="$(tar -xOzf "$tarball" package/package.json | jq -r '.name + "@" + .version')"
            if [ "$packed" != "$name@$version" ]; then
              echo "::error::$tarball holds $packed, expected $name@$version"
              exit 1
            fi
            if pnpm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            pnpm publish "$tarball" --access public --tag "$tag" --no-git-checks
          done
          echo "Published \`$version\` under the \`$tag\` dist-tag." >> "$GITHUB_STEP_SUMMARY"
