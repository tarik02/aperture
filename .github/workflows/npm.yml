name: npm

# Publishes the packages of the tag it is started at. It is started by publish.yml once the
# rest of a release is out, and by hand to publish a tag again: `gh workflow run npm.yml
# --ref v1.0.0-beta.1`. npm trusts this workflow by its file's name, so the publishing stays
# in this file.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    name: pack packages
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.27.1

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 26

      - run: pnpm install --frozen-lockfile

      # Before the build, which takes the version into what it builds. Internal
      # dependencies are `workspace:*`, so pack pins them to this version too.
      - name: Write the version
        run: .github/scripts/set-version.sh "${GITHUB_REF_NAME#v}"

      - run: pnpm --filter "./packages/**" build

      - name: Pack packages
        run: |
          for manifest in packages/*/package.json; do
            jq -e '.private != true' "$manifest" > /dev/null || continue
            pnpm --dir "$(dirname "$manifest")" pack --pack-destination "$RUNNER_TEMP/packages"
          done

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: npm-packages
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish packages
    needs: pack
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.27.1

      # No registry-url: it writes an empty auth token to .npmrc, which can stop the
      # OIDC token exchange that trusted publishing relies on.
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 26

      - uses: actions/download-artifact@v8.0.1
        with:
          name: npm-packages
          path: ${{ runner.temp }}/packages

      # A nightly is under `nightly`, another prerelease under what it is named as,
      # `beta` for 1.0.0-beta.2, and `latest` is a stable release's alone.
      - name: Publish packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag="latest"
          if [[ "$version" == *-nightly.* ]]; then
            tag="nightly"
          elif [[ "$version" == *-* ]]; then
            tag="${version#*-}"
            tag="${tag%%.*}"
          fi
          for manifest in packages/*/package.json; do
            jq -e '.private != true' "$manifest" > /dev/null || continue
            name="$(jq -r .name "$manifest")"
            tarball="$RUNNER_TEMP/packages/$(tr / - <<< "${name#@}")-$version.tgz"
            packed="$(tar -xOzf "$tarball" package/package.json | jq -r '.name + "@" + .version')"
            if [ "$packed" != "$name@$version" ]; then
              echo "::error::$tarball holds $packed, expected $name@$version"
              exit 1
            fi
            if pnpm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            pnpm publish "$tarball" --access public --tag "$tag" --no-git-checks
          done
          echo "Published \`$version\` under the \`$tag\` dist-tag." >> "$GITHUB_STEP_SUMMARY"
