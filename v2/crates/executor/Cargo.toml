[package]
name = "aperture-executor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
aperture-runner.workspace = true
aperture-store.workspace = true
axum = { version = "0.8", features = ["ws"] }
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }
clap = { version = "4", features = ["derive", "env"] }
connectrpc = { version = "0.9", features = ["axum"] }
futures-util.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[build-dependencies]
connectrpc-build = "0.9"
