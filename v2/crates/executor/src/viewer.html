<!doctype html>
<meta charset="utf-8" />
<title>Aperture session</title>
<style>
  html, body { margin: 0; height: 100%; background: #16181d; color: #c9ced6; font: 13px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; gap: 6px; padding: 6px; align-items: center; }
  #targets { display: flex; gap: 6px; min-width: 0; overflow-x: auto; }
  #bar button { flex: none; }
  #bar button { background: #262a33; color: inherit; border: 1px solid #3a3f4b; border-radius: 4px; padding: 3px 8px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bar button.selected { border-color: #7aa2f7; color: #fff; }
  #bar select { background: #262a33; color: inherit; border: 1px solid #3a3f4b; border-radius: 4px; padding: 2px 4px; }
  #controls { margin-left: auto; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  #state { opacity: 0.7; }
  /* Takes the keyboard without showing: what is typed goes to the session. */
  #keys { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; resize: none; }
  #files { position: fixed; right: 6px; top: 40px; z-index: 1; display: grid; gap: 6px; max-height: 50vh; max-width: 420px; overflow: auto; padding: 8px; background: #262a33; border: 1px solid #3a3f4b; border-radius: 6px; }
  #files[hidden], #asked[hidden] { display: none; }
  #files a { color: #7aa2f7; }
  #files button { background: #1a1d23; color: inherit; border: 1px solid #3a3f4b; border-radius: 4px; padding: 2px 8px; }
  #downloads { display: grid; gap: 4px; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  video, canvas { max-width: 100%; max-height: 100%; background: #000; outline: none; }
</style>
<div id="bar">
  <span id="targets"></span>
  <span id="controls">
    <select id="pixels" title="How the picture comes"><option value="video">WebRTC</option><option value="frames">Frames</option><option value="tiles">Tiles</option></select>
    <select id="codec" title="Form of the frames"><option value="">Codec: auto</option><option value="VIDEO_FORMAT_H264">H.264</option><option value="VIDEO_FORMAT_FULL_CHROMA">H.264 4:4:4</option><option value="VIDEO_FORMAT_H265">H.265</option><option value="VIDEO_FORMAT_VP9">VP9</option><option value="VIDEO_FORMAT_VP9_FULL_CHROMA">VP9 4:4:4</option><option value="VIDEO_FORMAT_AV1">AV1</option></select>
    <select id="quality" title="Video quality"><option value="">Quality: auto</option><option value="VIDEO_QUALITY_LOW">Low</option><option value="VIDEO_QUALITY_MEDIUM">Medium</option><option value="VIDEO_QUALITY_FULL">Full</option></select>
    <select id="fps" title="Frames a second at most"><option value="">FPS: auto</option><option>15</option><option>30</option><option>60</option></select>
    <select id="viewport" title="The page's size"><option value="">Viewport</option><option>1280x720</option><option>1920x1080</option><option>1024x768</option><option>390x844</option><option value="fit">Fit this window</option></select>
    <select id="scale" title="Pixels per CSS pixel"><option value="1">1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option><option value="3">3x</option></select>
    <button id="copied" title="The session copied text. This copies it here." hidden>Copy</button>
    <button id="filed" title="The session's downloads, and the files a page asks for" hidden></button>
    <button id="keyboard" title="Type into the session">⌨</button>
    <span id="state">connecting</span>
  </span>
</div>
<div id="files" hidden><div id="asked" hidden><span></span> <button id="choose">Choose…</button> <button id="refuse">Cancel</button><input id="chosen" type="file" hidden></div><div id="downloads"></div></div>
<div id="stage"><video id="video" autoplay muted playsinline tabindex="0" hidden></video><canvas id="canvas" tabindex="0" hidden></canvas><textarea id="keys" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Keyboard of the session"></textarea></div>
<script>
  // KeyboardEvent.code to Linux evdev key codes.
  const KEYS = {
    Escape: 1, Digit1: 2, Digit2: 3, Digit3: 4, Digit4: 5, Digit5: 6, Digit6: 7, Digit7: 8, Digit8: 9, Digit9: 10,
    Digit0: 11, Minus: 12, Equal: 13, Backspace: 14, Tab: 15, KeyQ: 16, KeyW: 17, KeyE: 18, KeyR: 19, KeyT: 20,
    KeyY: 21, KeyU: 22, KeyI: 23, KeyO: 24, KeyP: 25, BracketLeft: 26, BracketRight: 27, Enter: 28, ControlLeft: 29,
    KeyA: 30, KeyS: 31, KeyD: 32, KeyF: 33, KeyG: 34, KeyH: 35, KeyJ: 36, KeyK: 37, KeyL: 38, Semicolon: 39,
    Quote: 40, Backquote: 41, ShiftLeft: 42, Backslash: 43, KeyZ: 44, KeyX: 45, KeyC: 46, KeyV: 47, KeyB: 48,
    KeyN: 49, KeyM: 50, Comma: 51, Period: 52, Slash: 53, ShiftRight: 54, NumpadMultiply: 55, AltLeft: 56,
    Space: 57, CapsLock: 58, F1: 59, F2: 60, F3: 61, F4: 62, F5: 63, F6: 64, F7: 65, F8: 66, F9: 67, F10: 68,
    NumLock: 69, ScrollLock: 70, Numpad7: 71, Numpad8: 72, Numpad9: 73, NumpadSubtract: 74, Numpad4: 75,
    Numpad5: 76, Numpad6: 77, NumpadAdd: 78, Numpad1: 79, Numpad2: 80, Numpad3: 81, Numpad0: 82,
    NumpadDecimal: 83, IntlBackslash: 86, F11: 87, F12: 88, NumpadEnter: 96, ControlRight: 97, NumpadDivide: 98,
    AltRight: 100, Home: 102, ArrowUp: 103, PageUp: 104, ArrowLeft: 105, ArrowRight: 106, End: 107,
    ArrowDown: 108, PageDown: 109, Insert: 110, Delete: 111, MetaLeft: 125, MetaRight: 126, ContextMenu: 127,
  };
  const BUTTONS = ["MOUSE_BUTTON_LEFT", "MOUSE_BUTTON_MIDDLE", "MOUSE_BUTTON_RIGHT", "MOUSE_BUTTON_BACK", "MOUSE_BUTTON_FORWARD"];

  const base = location.pathname.replace(/\/$/, "");
  const state = document.getElementById("state");
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  let targets = [];
  let selected;

  // How the picture comes, best first: video over WebRTC, the same video as frames on the
  // session socket, tiles. `?pixels=` names where to start; what fails falls to the next.
  const WAYS = ["video", "frames", "tiles"].filter((way) => way !== "frames" || "VideoDecoder" in window);
  let way = WAYS[Math.max(0, WAYS.indexOf(new URLSearchParams(location.search).get("pixels")))];
  const controls = Object.fromEntries(["pixels", "codec", "quality", "fps", "viewport", "scale"].map((id) => [id, document.getElementById(id)]));
  for (const option of controls.pixels.options) option.disabled = !WAYS.includes(option.value);
  let view = video;
  const size = () => (view === video ? [video.videoWidth, video.videoHeight] : [canvas.width, canvas.height]);

  const socket = new WebSocket(`${location.origin.replace(/^http/, "ws")}${base}/ws${location.search}`);
  let peer, pointer, decoder, decodes;
  // The video's quality, as the session last said.
  let status;
  // What a decoder is asked for, by the form of the frames. Without a description the
  // frames are read as Annex B, which they are.
  const CODECS = {
    VIDEO_FORMAT_H264: "avc1.42e01f", VIDEO_FORMAT_FULL_CHROMA: "avc1.f4001f", VIDEO_FORMAT_H265: "hev1.1.6.L153.B0",
    VIDEO_FORMAT_VP9: "vp09.00.51.08", VIDEO_FORMAT_VP9_FULL_CHROMA: "vp09.01.51.08.03", VIDEO_FORMAT_AV1: "av01.0.13M.08",
  };
  // What a WebRTC connection calls the formats it carries.
  const RTC_CODECS = {
    VIDEO_FORMAT_H264: (codec) => codec.mimeType === "video/H264",
    VIDEO_FORMAT_H265: (codec) => codec.mimeType === "video/H265",
    VIDEO_FORMAT_VP9: (codec) => codec.mimeType === "video/VP9" && /profile-id=0/.test(codec.sdpFmtpLine ?? "profile-id=0"),
    VIDEO_FORMAT_VP9_FULL_CHROMA: (codec) => codec.mimeType === "video/VP9" && /profile-id=1/.test(codec.sdpFmtpLine ?? ""),
    VIDEO_FORMAT_AV1: (codec) => codec.mimeType === "video/AV1",
  };
  // The formats this browser takes the way the picture comes now.
  const decodable = async () => {
    const formats = [];
    for (const format of Object.keys(CODECS)) {
      if (way === "video") {
        const takes = RTC_CODECS[format];
        if (takes && RTCRtpReceiver.getCapabilities("video").codecs.some(takes)) formats.push(format);
      } else if (way === "frames") {
        const { supported } = await VideoDecoder.isConfigSupported({ codec: CODECS[format] }).catch(() => ({}));
        if (supported) formats.push(format);
      }
    }
    return formats;
  };
  const send = (message) => {
    const moved = message.pointerMotion && pointer?.readyState === "open";
    (moved ? pointer : socket).send(JSON.stringify(message));
  };

  // Says how the picture is to come: again whenever a control changes that.
  const hello = async () => {
    const decoded = await decodable();
    for (const option of controls.codec.options) option.disabled = option.value !== "" && !decoded.includes(option.value);
    if (!decoded.includes(controls.codec.value)) controls.codec.value = "";
    // Left to itself: sharp color where frames are decoded here, what every browser takes over WebRTC.
    const best = ["VIDEO_FORMAT_FULL_CHROMA", "VIDEO_FORMAT_H264"].filter((format) => way === "frames" && decoded.includes(format));
    const formats = controls.codec.value ? [controls.codec.value] : best;
    send({ hello: { pixels: `PIXELS_${way.toUpperCase()}`, formats, quality: controls.quality.value || undefined, fps: Number(controls.fps.value) || undefined } });
  };
  controls.codec.onchange = controls.quality.onchange = controls.fps.onchange = hello;
  controls.pixels.onchange = () => {
    peer?.close();
    peer = pointer = undefined;
    way = controls.pixels.value;
    start();
  };

  // The viewport is the watched target's own: its page gets the size and the scale.
  const watched = () => targets.find((item) => item.id === selected);
  const stage = document.getElementById("stage");
  const resize = () => {
    const chosen = controls.viewport.value;
    if (!chosen || !watched()) return;
    const [width, height] = chosen === "fit" ? [stage.clientWidth, stage.clientHeight] : chosen.split("x").map(Number);
    send({ viewport: { width, height, scale: Number(controls.scale.value) } });
  };
  controls.viewport.onchange = resize;
  controls.scale.onchange = () => {
    const target = watched();
    if (target) send({ viewport: { width: target.width, height: target.height, scale: Number(controls.scale.value) } });
  };
  let fitting;
  addEventListener("resize", () => {
    clearTimeout(fitting);
    if (controls.viewport.value === "fit") fitting = setTimeout(resize, 200);
  });

  const start = async () => {
    view = way === "video" ? video : canvas;
    video.hidden = view !== video;
    canvas.hidden = view !== canvas;
    controls.pixels.value = way;
    controls.codec.disabled = way === "tiles";
    controls.quality.disabled = controls.fps.disabled = way === "tiles";
    await hello();
    state.textContent = way;
    if (way !== "video") return;
    peer = new RTCPeerConnection();
    peer.addTransceiver("video", { direction: "recvonly" });
    // A move that is lost is not worth waiting for: the next one says where the pointer is.
    pointer = peer.createDataChannel("pointer", { ordered: true, maxRetransmits: 0 });
    peer.ontrack = (event) => {
      // Frames are shown as they come: one that waits to be smoothed is one seen late.
      event.receiver.jitterBufferTarget = 0;
      event.receiver.playoutDelayHint = 0;
      video.srcObject = new MediaStream([event.track]);
    };
    peer.onconnectionstatechange = () => {
      if (peer.connectionState !== "connected") state.textContent = `video: ${peer.connectionState}`;
      if (peer.connectionState === "failed") fall(`WebRTC ${peer.connectionState}`);
    };
    await peer.setLocalDescription(await peer.createOffer());
    send({ rtcOffer: { sdp: peer.localDescription.sdp } });
    // A network that drops its packets says nothing.
    const tried = peer;
    setTimeout(() => { if (peer === tried && peer.connectionState !== "connected") fall("WebRTC did not connect"); }, 8000);
  };
  const fall = (reason) => {
    const next = WAYS[WAYS.indexOf(way) + 1];
    console.warn(`${way}: ${reason}`);
    if (!next || socket.readyState !== WebSocket.OPEN) return;
    peer?.close();
    peer = pointer = undefined;
    way = next;
    start();
  };
  socket.onopen = start;
  socket.onclose = (event) => { state.textContent = `closed${event.reason ? `: ${event.reason}` : ""}`; };

  const bytes = async (base64) => (await fetch(`data:application/octet-stream;base64,${base64}`)).arrayBuffer();
  const fit = (width, height) => {
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
  };

  // What comes on the socket is drawn in the order it came.
  let drawn = Promise.resolve();
  const drawTile = async (tile) => {
    const image = await createImageBitmap(new Blob([await bytes(tile.png)], { type: "image/png" }));
    if (tile.target !== selected || way !== "tiles") return;
    fit(tile.width, tile.height);
    canvas.getContext("2d").drawImage(image, tile.x ?? 0, tile.y ?? 0);
  };
  const decodeFrame = async (frame) => {
    const data = await bytes(frame.data);
    // A frame let go is told too: the session counts on hearing of every frame.
    if (frame.target !== selected || way !== "frames") return send({ videoShown: { timeUs: String(frame.timeUs ?? 0) } });
    const shown = (time) => send({ videoShown: { timeUs: String(time) } });
    if (decoder?.state !== "configured" || decodes !== frame.format) {
      if (!frame.keyframe) return shown(frame.timeUs ?? 0);
      if (decoder?.state === "configured") decoder.close();
      decoder = new VideoDecoder({
        output: (picture) => {
          fit(picture.displayWidth, picture.displayHeight);
          canvas.getContext("2d").drawImage(picture, 0, 0);
          shown(picture.timestamp);
          picture.close();
        },
        error: (error) => fall(error.message),
      });
      decodes = frame.format;
      decoder.configure({ codec: CODECS[frame.format], optimizeForLatency: true });
    }
    decoder.decode(new EncodedVideoChunk({ type: frame.keyframe ? "key" : "delta", timestamp: Number(frame.timeUs ?? 0), data }));
  };

  socket.onmessage = (event) => {
    const message = JSON.parse(event.data);
    if (message.rtcAnswer) return peer?.setRemoteDescription({ type: "answer", sdp: message.rtcAnswer.sdp });
    if (message.rtcRefused) return fall(message.rtcRefused.reason);
    if (message.videoStatus) {
      status = message.videoStatus;
      const name = (value) => value.split("_").at(-1).toLowerCase();
      state.textContent = `${way}: ${name(status.quality)}, ${controls.codec.querySelector(`[value=${status.format}]`)?.textContent ?? status.format}, ${status.fps} fps`;
      return;
    }
    if (message.clipboard) return void copy(message.clipboard.forms ?? []);
    if (message.downloads) return showDownloads(message.downloads.downloads ?? []);
    if (message.fileRequests) requests = message.fileRequests.requests ?? [];
    if (message.tile) return void (drawn = drawn.then(() => drawTile(message.tile)));
    if (message.videoFrame) return void (drawn = drawn.then(() => decodeFrame(message.videoFrame)));
    if (message.targets) targets = message.targets.targets ?? [];
    if (message.selected) selected = message.selected.target;
    if (message.targets || message.selected) {
      const target = watched();
      if (target) {
        controls.scale.value = String(target.scale ?? 1);
        const sized = `${target.width}x${target.height}`;
        if (controls.viewport.value !== "fit") controls.viewport.value = [...controls.viewport.options].some((option) => option.value === sized) ? sized : "";
      }
    }
    if (message.fileRequests || message.selected) showRequest();
    if (message.cursor) video.style.cursor = canvas.style.cursor = message.cursor.hidden ? "none" : message.cursor.named ?? "default";
    const bar = document.getElementById("targets");
    bar.replaceChildren(...targets.map((item) => {
      const button = document.createElement("button");
      button.textContent = item.title || item.url || item.id;
      button.className = item.id === selected ? "selected" : "";
      button.onclick = () => send({ select: { target: item.id } });
      return button;
    }));
  };

  // Positions are in the target's own pixels, whatever size the picture is shown at.
  const position = (event) => {
    const box = view.getBoundingClientRect();
    // The picture may have more pixels than the target has logical ones.
    const { width, height } = watched() ?? { width: size()[0], height: size()[1] };
    return {
      x: (event.clientX - box.left) * (width / box.width),
      y: (event.clientY - box.top) * (height / box.height),
    };
  };
  for (const surface of [video, canvas]) {
    surface.addEventListener("pointermove", (event) => send({ pointerMotion: position(event) }));
    surface.addEventListener("pointerleave", () => send({ pointerLeave: {} }));
    for (const [type, pressed] of [["pointerdown", true], ["pointerup", false]]) {
      surface.addEventListener(type, (event) => {
        // A touch does not bring up the phone's keyboard; the keyboard button does.
        if (event.pointerType !== "touch") keys.focus({ preventScroll: true });
        if (pressed) surface.setPointerCapture(event.pointerId);
        send({ pointerButton: { ...position(event), button: BUTTONS[event.button], pressed } });
        event.preventDefault();
      });
    }
    surface.addEventListener("contextmenu", (event) => event.preventDefault());
    surface.addEventListener("wheel", (event) => {
      const notch = event.deltaMode === WheelEvent.DOM_DELTA_PIXEL ? 100 : 3;
      send({ pointerScroll: { ...position(event), dx: event.deltaX / notch, dy: event.deltaY / notch } });
      event.preventDefault();
    }, { passive: false });
  }

  // The keyboard. A key goes as the physical key it is where the session's keyboard, a US
  // one, writes the same with it, so that it is held and released as here; a key that
  // writes something else here goes as the text it writes, and so does all that a phone's
  // keyboard or an input method enters.
  const keys = document.getElementById("keys");
  const US = { Space: "  ", Minus: "-_", Equal: "=+", BracketLeft: "[{", BracketRight: "]}", Backslash: "\\|", Semicolon: ";:", Quote: "'\"", Backquote: "`~", Comma: ",<", Period: ".>", Slash: "/?" };
  [..."1!2@3#4$5%6^7&8*9(0)"].forEach((written, at, all) => { if (at % 2 === 0) US[`Digit${written}`] = written + all[at + 1]; });
  for (const letter of "abcdefghijklmnopqrstuvwxyz") US[`Key${letter.toUpperCase()}`] = letter + letter.toUpperCase();
  const [CONTROLS, METAS, PASTES] = [[29, 97], [125, 126], 47];
  // The keys down in the session.
  const held = new Set();
  const press = (code, pressed) => {
    if (pressed) held.add(code);
    else if (!held.delete(code)) return;
    send({ key: { code, pressed } });
  };
  const tap = (code) => { press(code, true); press(code, false); };
  // A phone's keyboard deletes only what there is to delete.
  const rest = () => { keys.value = " "; };
  rest();
  document.getElementById("keyboard").onclick = () => keys.focus({ preventScroll: true });
  keys.addEventListener("keydown", (event) => {
    // Composing, or a key of a phone's keyboard: the text comes of it.
    if (event.isComposing || event.keyCode === 229) return;
    const code = KEYS[event.code];
    if (code === undefined) return;
    const shortcut = event.ctrlKey || event.metaKey;
    // Pasting comes with what there is to paste.
    if (shortcut && event.code === "KeyV") return;
    const written = [...event.key].length === 1 && !shortcut ? event.key : undefined;
    const same = US[event.code]?.[event.shiftKey ? 1 : 0] === written;
    if (written === undefined || same) press(code, true);
    else send({ text: { text: written } });
    event.preventDefault();
  });
  keys.addEventListener("keyup", (event) => {
    const code = KEYS[event.code];
    if (code !== undefined) press(code, false);
    event.preventDefault();
  });
  keys.addEventListener("blur", () => [...held].forEach((code) => press(code, false)));
  keys.addEventListener("compositionupdate", (event) => send({ text: { text: event.data, composing: true } }));
  keys.addEventListener("compositionend", (event) => {
    send({ text: { text: event.data } });
    rest();
  });
  keys.addEventListener("beforeinput", (event) => {
    if (event.isComposing || /Composition/u.test(event.inputType)) return;
    event.preventDefault();
    if (/^insert(Text|ReplacementText)$/u.test(event.inputType) && event.data) send({ text: { text: event.data } });
    if (/^insert(LineBreak|Paragraph)$/u.test(event.inputType)) tap(KEYS.Enter);
    if (event.inputType === "deleteContentBackward") tap(KEYS.Backspace);
    if (event.inputType === "deleteContentForward") tap(KEYS.Delete);
  });
  keys.addEventListener("input", rest);
  const base64 = async (blob) => {
    const reader = new FileReader();
    const read = new Promise((done) => { reader.onload = done; });
    reader.readAsDataURL(blob);
    await read;
    return reader.result.split(",")[1];
  };
  // Files get to the session's browser by way of the session's files: they are put there,
  // and the browser is told where they are.
  const upload = async (file) => {
    const answer = await fetch(`${base}/uploads/${encodeURIComponent(file.name)}${location.search}`, { method: "PUT", body: file });
    if (!answer.ok) throw new Error(await answer.text());
    return answer.json();
  };
  const listed = async (files) => {
    const uris = (await Promise.all(files.map(upload))).map(({ path }) => `file://${path.split("/").map(encodeURIComponent).join("/")}\r\n`);
    return { type: "text/uri-list", data: await base64(new Blob(uris)) };
  };
  // What is dropped on the picture is dropped on the page, there.
  for (const surface of [video, canvas]) {
    surface.addEventListener("dragover", (event) => {
      event.preventDefault();
      event.dataTransfer.dropEffect = "copy";
    });
    surface.addEventListener("drop", async (event) => {
      event.preventDefault();
      const at = position(event);
      const files = [...event.dataTransfer.files];
      const texts = ["text/plain", "text/html"].map((type) => [type, event.dataTransfer.getData(type)]).filter(([, text]) => text);
      const forms = files.length ? [await listed(files)] : await Promise.all(texts.map(async ([type, text]) => ({ type, data: await base64(new Blob([text])) })));
      if (forms.length) send({ drop: { ...at, content: { forms } } });
    });
  }

  // The session's downloads, and the files its pages ask for.
  const panel = document.getElementById("files");
  const filed = document.getElementById("filed");
  const asked = document.getElementById("asked");
  const chosen = document.getElementById("chosen");
  let requests = [];
  let done = 0;
  filed.onclick = () => { panel.hidden = !panel.hidden; };
  const showDownloads = (downloads) => {
    const size = (bytes) => bytes >= 1048576 ? `${(bytes / 1048576).toFixed(1)} MB` : `${Math.ceil(bytes / 1024)} kB`;
    document.getElementById("downloads").replaceChildren(...downloads.toReversed().map((download) => {
      const row = document.createElement("div");
      const state = download.state.split("_").at(-1).toLowerCase();
      const received = Number(download.receivedBytes ?? 0);
      if (state === "done") {
        const link = document.createElement("a");
        link.href = `${base}/files/downloads/${encodeURIComponent(download.name)}${location.search}`;
        link.download = link.textContent = download.name;
        row.append(link, ` ${size(received)}`);
      } else {
        const part = download.totalBytes ? `${Math.round(100 * received / Number(download.totalBytes))}%` : size(received);
        row.textContent = `${download.name} ${state === "failed" ? "failed" : part}`;
      }
      return row;
    }));
    // A download that got done is shown.
    const finished = downloads.filter((download) => download.state === "DOWNLOAD_STATE_DONE").length;
    if (finished > done) panel.hidden = false;
    done = finished;
    filed.textContent = `⬇ ${downloads.length}`;
    filed.hidden = !downloads.length && asked.hidden;
  };
  const showRequest = () => {
    const request = requests.find((one) => one.target === selected);
    asked.hidden = !request;
    if (!request) return;
    asked.firstElementChild.textContent = request.multiple ? "The page asks for files." : "The page asks for a file.";
    chosen.multiple = Boolean(request.multiple);
    const answer = (files) => send({ filesChosen: { id: String(request.id), files } });
    document.getElementById("choose").onclick = () => chosen.click();
    document.getElementById("refuse").onclick = () => answer([]);
    chosen.onchange = async () => {
      const put = await Promise.all([...chosen.files].map(upload));
      chosen.value = "";
      answer(put.map(({ name }) => name));
    };
    filed.textContent ||= "⬇ 0";
    filed.hidden = panel.hidden = false;
  };

  // A picture as the PNG the session's clipboard carries.
  const png = async (picture) => {
    if (picture.type === "image/png") return picture;
    const bitmap = await createImageBitmap(picture);
    const drawn = new OffscreenCanvas(bitmap.width, bitmap.height);
    drawn.getContext("2d").drawImage(bitmap, 0, 0);
    return drawn.convertToBlob({ type: "image/png" });
  };
  // The session gets what is pasted here, then the keys that paste there.
  keys.addEventListener("paste", async (event) => {
    event.preventDefault();
    const parts = ["text/plain", "text/html"].map((type) => [type, event.clipboardData.getData(type)]).filter(([, text]) => text).map(([type, text]) => [type, new Blob([text])]);
    const files = [...event.clipboardData.files];
    // One picture is pasted as a picture, which more pages take than take a file.
    const picture = files.length === 1 && files[0].type.startsWith("image/");
    if (picture) parts.push(["image/png", await png(files[0])]);
    const forms = await Promise.all(parts.map(async ([type, blob]) => ({ type, data: await base64(blob) })));
    if (files.length && !picture) forms.push(await listed(files));
    if (!forms.length) return;
    send({ clipboard: { forms } });
    // Pasting is Control and V there, whatever it is here.
    METAS.forEach((code) => press(code, false));
    const controlled = CONTROLS.some((code) => held.has(code));
    if (!controlled) press(CONTROLS[0], true);
    tap(PASTES);
    if (!controlled) press(CONTROLS[0], false);
  });

  // What the session copied goes to the clipboard here where the browser lets a page
  // write to it at any time. Elsewhere a button does it at a click: text is copied, a
  // picture opens to be copied by hand.
  const copied = document.getElementById("copied");
  const copy = async (forms) => {
    const had = await Promise.all(forms.filter((form) => ["text/plain", "text/html", "image/png"].includes(form.type)).map(async (form) => [form.type, new Blob([await bytes(form.data)], { type: form.type })]));
    if (!had.length) return;
    const blobs = Object.fromEntries(had);
    try {
      await navigator.clipboard.write([new ClipboardItem(blobs)]);
      copied.hidden = true;
    } catch {
      const text = await blobs["text/plain"]?.text();
      copied.textContent = text === undefined ? "Copied picture" : "Copy";
      copied.hidden = false;
      copied.onclick = () => {
        copied.hidden = true;
        if (text === undefined) return void window.open(URL.createObjectURL(blobs["image/png"] ?? blobs["text/html"]));
        const from = document.createElement("textarea");
        from.value = text;
        document.body.append(from);
        from.select();
        document.execCommand("copy");
        from.remove();
        keys.focus({ preventScroll: true });
      };
    }
  };
</script>
