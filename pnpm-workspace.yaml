packages:
  - apps/*
  - extensions/*
  - packages/*

onlyBuiltDependencies:
  - esbuild

catalog:
  "@atlaskit/pragmatic-drag-and-drop": "^2.0.1"
  "@base-ui/react": "^1.6.0"
  class-variance-authority: "^0.7.1"
  clsx: "^2.1.1"
  devalue: 6.0.2
  effect: 4.0.0-rc.117
  effect-playwright: 0.8.0-2
  "@effect/language-service": 0.87.2
  "@effect/openapi-generator": 4.0.0-rc.117
  "@effect/platform-node": 4.0.0-rc.117
  "@floating-ui/dom": "^1.8.0"
  "@fontsource-variable/geist": "^5.2.9"
  idb: 8.0.3
  lucide-react: "^1.24.0"
  next-themes: "^0.4.6"
  playwright: 1.64.0-alpha-1789764292000
  playwright-core: 1.64.0-alpha-1789764292000
  "@playwright/mcp": 0.0.82
  publint: 0.3.24
  react: "^19.2.7"
  react-dom: "^19.2.7"
  react-resizable-panels: "^4.12.2"
  "@resvg/resvg-js": "^2.6.2"
  shadcn: "^4.13.0"
  "@simplewebauthn/browser": 13.3.0
  sonner: "^2.0.7"
  tailwind-merge: "^3.6.0"
  tailwindcss: "^4.3.2"
  "@tailwindcss/cli": "^4.3.2"
  "@tailwindcss/vite": "^4.3.2"
  "@tanstack/react-hotkeys": "^0.10.0"
  "@tanstack/react-query": "^5.101.2"
  "@tanstack/react-router": "^1.170.17"
  "@tanstack/react-start": "^1.168.27"
  "@tanstack/router-cli": "^1.167.18"
  tw-animate-css: "^1.4.0"
  "@types/chrome": 0.3.0
  "@types/node": "^26.1.1"
  "@types/react": "^19.2.17"
  "@types/react-dom": "^19.2.3"
  typescript: "^6.0.3"
  "@typescript/native-preview": 7.0.0-dev.20260707.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.4
  vite-plus: 0.2.4
  "@vitejs/plugin-react": "^6.0.3"
  vitest: 4.1.10
  zustand: "^5.0.14"

catalogs:
  peers:
    effect: "^4.0.0-rc.117"
    react: "^19.2.7"
    react-dom: "^19.2.7"

catalogMode: strict

overrides:
  effect-playwright>playwright-core: "catalog:"
  vite: "catalog:"
  vitest: "catalog:"

packageExtensions:
  "@effect/platform-node":
    peerDependenciesMeta:
      redis:
        optional: true

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

minimumReleaseAgeExclude:
  - "@typescript/native-preview-darwin-arm64@7.0.0-dev.20260707.2"
  - "@typescript/native-preview-darwin-x64@7.0.0-dev.20260707.2"
  - "@typescript/native-preview-linux-arm64@7.0.0-dev.20260707.2"
  - "@typescript/native-preview-linux-arm@7.0.0-dev.20260707.2"
  - "@typescript/native-preview-linux-x64@7.0.0-dev.20260707.2"
  - "@typescript/native-preview-win32-arm64@7.0.0-dev.20260707.2"
  - "@typescript/native-preview-win32-x64@7.0.0-dev.20260707.2"
  - "@typescript/native-preview@7.0.0-dev.20260707.2"
  - devalue@6.0.2

allowBuilds:
  "@parcel/watcher": false
  esbuild: true
