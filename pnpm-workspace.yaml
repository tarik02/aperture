packages:
  - apps/*
  - packages/*
  - e2e

onlyBuiltDependencies:
  - esbuild

catalog:
  "@atlaskit/pragmatic-drag-and-drop": "^2.0.1"
  "@base-ui/react": "^1.9.0"
  "@bufbuild/protobuf": 2.17.0
  "@bufbuild/protoc-gen-es": 2.17.0
  "@connectrpc/connect": 2.3.0
  "@connectrpc/connect-web": 2.3.0
  class-variance-authority: "^0.7.1"
  clsx: "^2.1.1"
  effect: 4.0.0
  "@effect/platform-node": 4.0.0
  "@effect/platform-node-shared": 4.0.0
  "@effect/sql-pg": 4.0.0
  "@effect/vitest": 4.0.0
  "@fontsource-variable/geist": "^5.2.9"
  lucide-react: "^1.24.0"
  next-themes: "^0.4.6"
  publint: 0.3.24
  react: "^19.2.7"
  react-dom: "^19.2.7"
  react-resizable-panels: "^4.12.2"
  sonner: "^2.0.7"
  "@tanstack/react-query": "^5.90.0"
  "@tanstack/react-router": "^1.130.0"
  tailwind-merge: "^3.6.0"
  tailwindcss: "^4.3.2"
  "@tailwindcss/cli": "^4.3.2"
  "@tailwindcss/vite": "^4.3.2"
  tw-animate-css: "^1.4.0"
  "@types/node": "^26.1.1"
  "@types/react": "^19.2.17"
  "@types/react-dom": "^19.2.3"
  typescript: "^6.0.3"
  "@typescript/native-preview": 7.0.0-dev.20260707.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.4
  vite-plus: 0.2.4
  vitest: 4.1.10
  vite-plugin-singlefile: 2.3.4
  "@vitejs/plugin-react": "^6.0.3"

catalogs:
  peers:
    effect: "^4.0.0"
    react: "^19.2.7"
    react-dom: "^19.2.7"

catalogMode: strict

overrides:
  # Later releases of it ask for a later effect than the one the catalog has.
  "@effect/platform-node-shared": "catalog:"
  vite: "catalog:"

packageExtensions:
  "@effect/platform-node":
    peerDependenciesMeta:
      redis:
        optional: true

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

minimumReleaseAgeExclude:
  - "@typescript/native-preview-darwin-arm64@7.0.0-dev.20260707.2"
  - "@typescript/native-preview-darwin-x64@7.0.0-dev.20260707.2"
  - "@typescript/native-preview-linux-arm64@7.0.0-dev.20260707.2"
  - "@typescript/native-preview-linux-arm@7.0.0-dev.20260707.2"
  - "@typescript/native-preview-linux-x64@7.0.0-dev.20260707.2"
  - "@typescript/native-preview-win32-arm64@7.0.0-dev.20260707.2"
  - "@typescript/native-preview-win32-x64@7.0.0-dev.20260707.2"
  - "@typescript/native-preview@7.0.0-dev.20260707.2"
  - devalue@6.0.2
  - "@effect/openapi-generator@4.0.0"
  - "@effect/platform-node-shared@4.0.0"
  - "@effect/platform-node@4.0.0"
  - effect-playwright@0.8.0
  - effect@4.0.0

allowBuilds:
  "@parcel/watcher": false
  vue-demi: false
  esbuild: true
