# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.8.0/configuration-schema.json
package: openapi
output: ../internal/httpapi/openapi/openapi.gen.go
generate:
  models: true
  gin-server: true
  strict-server: true
  client: true
output-options:
  skip-prune: true
  # Traefik sends live-session routes to the session's wrapper. The daemon must not
  # register them, or it would answer them itself while the session is not running.
  exclude-tags: [live-session]
